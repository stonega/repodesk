name: Browser VPS deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect the VPS through its trusted host Docker daemon
        run: |
          set -euo pipefail
          docker run --rm --privileged --pid host --network host \
            --entrypoint nsenter docker:29-cli@sha256:b1805116a6a86cc591b5d5f60a910a0715cdcc9d18d866ad68b1457ead25c35c \
            -t 1 -m -u -i -n -p -- /bin/bash -c 'hostname; id; cat /etc/os-release; uname -m; for cmd in node chromium chromium-browser google-chrome Xvfb xauth nft dnf apt-get; do command -v "$cmd" || true; done; df -h /opt; free -h; cat /opt/repodesk/.current-release; systemctl is-active repodesk-browser 2>/dev/null || true; docker ps --format "{{.Names}} {{.Image}} {{.Status}}"; docker inspect --format "{{json .HostConfig.SecurityOpt}}" repodesk-app-1 repodesk-worker-1; ss -ltnp sport = :22'
