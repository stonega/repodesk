name: Browser VPS deployment
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [deploy, resume, status]
        default: deploy
      release:
        type: string
        required: false
      log:
        type: choice
        options: [none, trace, system, resume-driver.log, resume-firewall-check.log, resume-module-nf_tables.log, resume-module-nft_reject_inet.log, build-app.log, build-job.log, build-supervisor.log, container-checks.log, host-install.log, chrome-install.log, native-host-verification.json, cutover.log, production-verification.log, driver.log]
        default: none
permissions:
  contents: read
concurrency:
  group: browser-vps-${{ inputs.mode == 'status' && 'status' || 'deploy' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: ${{ inputs.mode != 'status' }}
        with:
          node-version: '24'
      - name: Prepare an authenticated disposable SSH client
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          client="repodesk-browser-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' '169.58.58.71 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICEDUy/5JHbjzCdnECyCEun1u7LWbFz3oM0KIvlVirfK' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          docker create --name "$client" --network host --cap-drop ALL --cap-add DAC_OVERRIDE --security-opt no-new-privileges:true \
            --entrypoint sleep docker:29-cli@sha256:b1805116a6a86cc591b5d5f60a910a0715cdcc9d18d866ad68b1457ead25c35c 5400
          docker cp "$ssh_dir/key" "$client:/tmp/key"
          docker cp "$ssh_dir/known_hosts" "$client:/tmp/known_hosts"
          docker start "$client"
          printf 'DEPLOY_CLIENT=%s\nRELEASE_ID=%s-%s\n' "$client" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Inspect deployment progress and scoped diagnostics
        if: ${{ inputs.mode == 'status' }}
        env:
          STATUS_RELEASE: ${{ inputs.release }}
          DIAGNOSTIC_LOG: ${{ inputs.log }}
        run: |
          set -euo pipefail
          [[ "$STATUS_RELEASE" =~ ^[0-9]+-[0-9]+$ ]]
          source deploy/browser-operator/client.sh
          ssh_vps "set -eu; cd /opt/repodesk/releases/$STATUS_RELEASE; for f in stage deploy.exit failure.json; do if test -f \"\$f\"; then printf '%s: ' \"\$f\"; cat \"\$f\"; fi; done; printf 'current-release: '; cat /opt/repodesk/.current-release; systemctl is-active repodesk-browser || true; docker ps --format '{{.Names}} {{.Image}} {{.Status}}'"
          case "$DIAGNOSTIC_LOG" in
            none|'') ;;
            trace)
              ssh_vps "bash -s -- /opt/repodesk/releases/$STATUS_RELEASE" < deploy/browser-operator/diagnose.sh ;;
            system)
              ssh_vps "set -eu; systemctl show repodesk-browser -p MainPID -p User -p Group -p CapabilityBoundingSet -p NoNewPrivileges -p ProtectKernelModules -p ProtectKernelTunables; journalctl -u repodesk-browser --no-pager -n 20; getent passwd | grep '^rdb_' || true; nft list table inet repodesk_browser || true; command -v xdpyinfo || true; lsmod | grep -E 'nft|nf_tables' || true" ;;
            resume-driver.log|resume-firewall-check.log|resume-module-nf_tables.log|resume-module-nft_reject_inet.log|build-app.log|build-job.log|build-supervisor.log|container-checks.log|host-install.log|chrome-install.log|native-host-verification.json|cutover.log|production-verification.log|driver.log)
              ssh_vps "tail -n 30 /opt/repodesk/releases/$STATUS_RELEASE/$DIAGNOSTIC_LOG" ;;
            *) exit 1 ;;
          esac
      - name: Package and transfer the verified source and checksums
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          umask 077
          source deploy/browser-operator/client.sh
          payload="$RUNNER_TEMP/browser-payload"
          mkdir -p "$payload"
          cp deploy/browser-operator/*.py deploy/browser-operator/*.mjs deploy/browser-operator/*.json deploy/browser-operator/*.yaml deploy/browser-operator/run-deployment.sh "$payload/"
          git archive --format=tar.gz "$GITHUB_SHA" > "$payload/source.tar.gz"
          cp scripts/deploy-vps.sh "$payload/deploy-vps.sh"
          cp deploy/codex/docker-compose.yaml "$payload/codex-compose.yaml"
          cp deploy/codex/release-config.mjs "$payload/codex-release-config.mjs"
          cp deploy/codex/wait-checkpoint.mjs "$payload/codex-wait-checkpoint.mjs"
          node deploy/browser-operator/prepare-payload.mjs "$payload"
          tar -czf "$RUNNER_TEMP/browser-payload.tgz" -C "$payload" .
          ssh_vps "set -eu; test ! -e /opt/repodesk/releases/$RELEASE_ID; umask 077; mkdir /opt/repodesk/releases/$RELEASE_ID"
          docker cp "$RUNNER_TEMP/browser-payload.tgz" "$DEPLOY_CLIENT:/tmp/payload.tgz"
          docker exec "$DEPLOY_CLIENT" scp -i /tmp/key -P 22 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts -o ConnectTimeout=15 \
            /tmp/payload.tgz "root@169.58.58.71:/opt/repodesk/releases/$RELEASE_ID/payload.tgz"
          ssh_vps "set -eu; cd /opt/repodesk/releases/$RELEASE_ID; tar -xzf payload.tgz; test -f source-metadata.json; test -f release.py"
      - name: Start the guarded VPS deployment
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          source deploy/browser-operator/client.sh
          ssh_vps "systemd-run --unit=repodesk-browser-deploy-$RELEASE_ID --collect --property=Type=exec --property=RuntimeMaxSec=3600 --property=TimeoutStopSec=180 --property=WorkingDirectory=/opt/repodesk/releases/$RELEASE_ID /bin/bash /opt/repodesk/releases/$RELEASE_ID/run-deployment.sh"
      - name: Resume the verified pre-cutover release after prerequisite repair
        if: ${{ inputs.mode == 'resume' }}
        env:
          STATUS_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$STATUS_RELEASE" =~ ^[0-9]+-[0-9]+$ ]]
          source deploy/browser-operator/client.sh
          native_archive="native-source-$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz "$GITHUB_SHA" > "$RUNNER_TEMP/$native_archive"
          sha256sum "$RUNNER_TEMP/$native_archive" | cut -d' ' -f1 > "$RUNNER_TEMP/native-source-$GITHUB_SHA.sha256"
          cp deploy/browser-operator/expected-host-manifest.json "$RUNNER_TEMP/native-manifest-$GITHUB_SHA.json"
          for file in "$native_archive" "native-source-$GITHUB_SHA.sha256" "native-manifest-$GITHUB_SHA.json"; do
            docker cp "$RUNNER_TEMP/$file" "$DEPLOY_CLIENT:/tmp/$file"
            docker exec "$DEPLOY_CLIENT" scp -i /tmp/key -P 22 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts \
              "/tmp/$file" "root@169.58.58.71:/opt/repodesk/releases/$STATUS_RELEASE/$file"
          done
          docker cp deploy/browser-operator/resume.py "$DEPLOY_CLIENT:/tmp/resume.py"
          docker cp deploy/browser-operator/run-resume.sh "$DEPLOY_CLIENT:/tmp/run-resume.sh"
          for file in resume.py run-resume.sh; do
            docker exec "$DEPLOY_CLIENT" scp -i /tmp/key -P 22 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts \
              "/tmp/$file" "root@169.58.58.71:/opt/repodesk/releases/$STATUS_RELEASE/$file"
          done
          ssh_vps "set -eu; cd /opt/repodesk/releases/$STATUS_RELEASE; test -f deploy.exit; test \"\$(cat deploy.exit)\" != 0; test ! -e deploy.exit.failure-$GITHUB_RUN_ID; mv deploy.exit deploy.exit.failure-$GITHUB_RUN_ID; printf '%s\n' '$GITHUB_SHA' > resume-commit; systemd-run --unit=repodesk-browser-deploy-$STATUS_RELEASE-resume-$GITHUB_RUN_ID --collect --property=Type=exec --property=RuntimeMaxSec=3600 --property=TimeoutStopSec=180 --property=WorkingDirectory=/opt/repodesk/releases/$STATUS_RELEASE /bin/bash /opt/repodesk/releases/$STATUS_RELEASE/run-resume.sh"
          printf 'RELEASE_ID=%s\n' "$STATUS_RELEASE" >> "$GITHUB_ENV"
      - name: Wait for image checks, host installation, backup and cutover
        if: ${{ inputs.mode != 'status' }}
        run: |
          set -euo pipefail
          source deploy/browser-operator/client.sh
          previous=''
          for attempt in {1..720}; do
            status=$(ssh_vps "if test -f /opt/repodesk/releases/$RELEASE_ID/deploy.exit; then printf 'exit:'; cat /opt/repodesk/releases/$RELEASE_ID/deploy.exit; elif test -f /opt/repodesk/releases/$RELEASE_ID/stage; then cat /opt/repodesk/releases/$RELEASE_ID/stage; else printf 'starting'; fi")
            if [[ "$status" != "$previous" ]]; then printf '%s\n' "$status"; previous="$status"; fi
            case "$status" in
              exit:0) exit 0 ;;
              exit:*) ssh_vps "cat /opt/repodesk/releases/$RELEASE_ID/failure.json 2>/dev/null || true"; exit 1 ;;
            esac
            sleep 5
          done
          echo 'Deployment exceeded the observation deadline. Inspect its protected VPS logs.' >&2
          exit 1
      - name: Save the production verification receipt
        if: ${{ inputs.mode != 'status' }}
        run: |
          set -euo pipefail
          source deploy/browser-operator/client.sh
          ssh_vps "cat /opt/repodesk/releases/$RELEASE_ID/deployment-receipt.json" > "$RUNNER_TEMP/browser-deployment-receipt.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/browser-deployment-receipt.json");console.log(JSON.stringify({release:r.release_id,commit:r.source_commit,services:r.services,browser:r.browser_host,backup:r.backup},null,2))'
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode != 'status' }}
        with:
          name: browser-deployment-receipt
          path: ${{ runner.temp }}/browser-deployment-receipt.json
      - name: Remove the disposable SSH client
        if: always()
        run: |
          if [[ -n "${DEPLOY_CLIENT:-}" ]]; then docker rm -f "$DEPLOY_CLIENT"; fi
