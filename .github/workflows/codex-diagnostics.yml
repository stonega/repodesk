name: Inspect private browser thread
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect scoped production metadata
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          client="repodesk-thread-inspect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$client" >/dev/null 2>&1 || true; rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' '169.58.58.71 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICEDUy/5JHbjzCdnECyCEun1u7LWbFz3oM0KIvlVirfK' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          docker create --name "$client" --network host --cap-drop ALL --cap-add DAC_OVERRIDE --security-opt no-new-privileges:true --entrypoint sleep docker:29-cli@sha256:b1805116a6a86cc591b5d5f60a910a0715cdcc9d18d866ad68b1457ead25c35c 480
          docker cp "$ssh_dir/key" "$client:/tmp/key"
          docker cp "$ssh_dir/known_hosts" "$client:/tmp/known_hosts"
          docker start "$client"
          ssh_vps() { docker exec -i "$client" ssh -T -i /tmp/key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts -o ConnectTimeout=15 root@169.58.58.71 "$@"; }
          ssh_vps 'test "$(cat /opt/repodesk/.current-release)" = 41965848447-1 && printf %s  | base64 -d | docker exec -i repodesk-app-1 node --input-type=module'
