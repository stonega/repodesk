x-runtime: &a1
  build: .
  image: ${APP_IMAGE:-deepx-agent:local}
  init: true
  environment: &a2
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: postgres://deepx:${POSTGRES_PASSWORD:?Set
      POSTGRES_PASSWORD}@postgres:5432/deepx
    TELEGRAM_TRANSPORT: ${TELEGRAM_TRANSPORT:-webhook}
    RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
  secrets:
    - encryption_key
  restart: unless-stopped
  stop_grace_period: 30s
services:
  postgres:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_USER: deepx
      POSTGRES_DB: deepx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U deepx -d deepx
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *a1
    command:
      - node
      - dist/migrate.js
    restart: no
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
  app:
    <<: *a1
    environment:
      <<: *a2
      UPDATES_GITHUB_REPOSITORY: ${UPDATES_GITHUB_REPOSITORY:-stonega/repodesk}
      UPDATES_GITHUB_TOKEN: ${UPDATES_GITHUB_TOKEN:-}
      UPDATES_DIRECTORY: ${UPDATES_DIRECTORY:-/var/lib/repodesk-updates}
      CODE_TRUTH_URL: http://code-truth:3010
      CODE_TRUTH_TOKEN_FILE: /run/code-truth/token
      BROWSER_HOST_SOCKET: /run/repodesk-browser/control.sock
      BROWSER_HOST_TOKEN_FILE: /run/secrets/browser_token
      BROWSER_CODEX_ORIGIN: http://app:3000
    volumes:
      - transcription_models:/var/lib/repodesk-models
      - ./updates:/var/lib/repodesk-updates
      - code_truth_auth:/run/code-truth:ro
      - /run/repodesk-browser:/run/repodesk-browser:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+process.env.PORT+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      code-truth:
        condition: service_healthy
    secrets:
      - browser_token
    group_add:
      - "1000"
  worker:
    <<: *a1
    command:
      - node
      - dist/worker.js
    environment:
      <<: *a2
      CODE_TRUTH_URL: http://code-truth:3010
      CODE_TRUTH_TOKEN_FILE: /run/code-truth/token
      BROWSER_HOST_SOCKET: /run/repodesk-browser/control.sock
      BROWSER_HOST_TOKEN_FILE: /run/secrets/browser_token
      BROWSER_CODEX_ORIGIN: http://app:3000
    volumes:
      - transcription_models:/var/lib/repodesk-models
      - code_truth_auth:/run/code-truth:ro
      - /run/repodesk-browser:/run/repodesk-browser:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const {Client}=require('pg');const c=new
          Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query("SELECT
          1 FROM worker_heartbeats WHERE at>now()-interval '30 seconds' LIMIT
          1")).then(r=>{if(!r.rowCount)process.exitCode=1}).catch(()=>{process.exitCode=1}).finally(()=>c.end())
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      code-truth:
        condition: service_healthy
    secrets:
      - browser_token
    group_add:
      - "1000"
  code-truth-token:
    build: .
    image: ${APP_IMAGE:-deepx-agent:local}
    user: 0:0
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - node
      - dist/code-truth-token.js
    healthcheck:
      disable: true
    restart: no
    volumes:
      - code_truth_auth:/run/code-truth
  code-truth:
    build: ./services/code-truth
    image: ${CODE_TRUTH_IMAGE:-deepx-code-truth:local}
    init: true
    environment:
      CODE_TRUTH_TOKEN_FILE: /run/code-truth/token
      GITHUB_TOKEN: ${CODE_TRUTH_GITHUB_TOKEN:-}
    volumes:
      - code_truth_auth:/run/code-truth:ro
      - code_truth_data:/data
    tmpfs:
      - /tmp:rw,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      code-truth-token:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3010/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  transcription_models: null
  postgres_data: null
  code_truth_auth: null
  code_truth_data: null
secrets:
  encryption_key:
    file: ${ENCRYPTION_KEY_FILE:-./secrets/encryption-key}
  browser_token:
    file: ${BROWSER_TOKEN_FILE:-./secrets/browser-token}
